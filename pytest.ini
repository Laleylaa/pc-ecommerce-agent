[pytest]
testpaths = tests/agent_loop tests/tools tests/application
pythonpath = backend . tests
addopts = --strict-markers
norecursedirs = .git .venv archive artifacts evals tests/legacy tests/integration
markers =
    contract: schema, transport, budget and lifecycle contracts
    business: business acceptance against independent expected results
    boundary: edge cases and bounded failures with synthetic data or models
    smoke: representative offline checks, not live application E2E
    network: external service checks (not allowed by offline runner)
