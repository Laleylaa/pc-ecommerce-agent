[project]
name = "pc-agent-backend"
version = "0.1.0"
license = {text = "MIT"}
description = "FastAPI + Strands agent-loop backend for a PC peripherals ecommerce support agent."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "sentence-transformers>=3.0.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "strands-agents[openai]==1.61.1",
  "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.setuptools.package-data]
"app.tools.prompts" = ["templates/*/*.md", "templates/*/*/*.md"]
